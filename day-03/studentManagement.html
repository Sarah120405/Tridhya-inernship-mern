<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #2563eb;
            --accent: #10b981;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);
            color: var(--text);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: linear-gradient(90deg, #0f172a, #2563eb);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        button, select, input[type="text"], input[type="number"] {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.2);
        }

        button:hover {
            padding: 12px 16px;
        }

        select {
            background-color: white;
            border: 1px solid var(--border);
            color: var(--text);
        }

        main {
            padding: 24px 32px 40px;
        }

        .statistics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 24px 0;
        }

        .statistics div {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }

        h3 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        .statistics p {
            margin: 8px 0 0;
            font-size: 28px;
            font-weight: 700;
        }

        .action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .table-wrapper {
            background-color: var(--card);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            overflow-x: auto;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        tbody tr:hover {
            background-color: #f8fbff;
        }

        .form-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .form-wrapper.show-overlay {
            display: flex;
        }

        form {
            position: relative;
            width: 500px;
            background-color: var(--card);
            border-radius: 16px;
            height: fit-content;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
        }

        .form-row {
            display: flex;
            width: 100%;
            margin: 12px 0;
            justify-content: space-between;
            gap: 10px;
        }

        .form-row > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-row input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        #closeFormButton {
            background-color: #e5e7eb;
            color: var(--text);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Student Management System</h1>
        <button id="addStudentButton">Add Student +</button>
    </header>
    <main>
        <div class="statistics">
            <div>
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>
            <div>
                <h3>Class Average</h3>
                <p id="classAverage">0</p>
            </div>
            <div>
                <h3>Top Student</h3>
                <p id="topStudent">None</p>
            </div>
            <div>
                <h3>Students Above Threshold</h3>
                <p id="studentsAboveThreshold">0</p>
            </div>
        </div>
        <div class="action">
            <div class="controls">
                <select id="sortCriteria">
                    <option value="name">Name</option>
                    <option value="grade">Average Grade</option>
                </select>
                <button id="sortButton">Sort</button>
            </div>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search by name...">
                <button id="searchButton">Search</button>
            </div>
        </div>
        
        <div class="table-wrapper">
            <h2>Student List</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>City</th>
                        <th>Average Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="displayRow">
                    <!-- Student rows will be populated here -->
                </tbody>
            </table>
        </div>
    </main>

    <div class="form-wrapper">
        <form id="studentForm">
            <div class="form-row">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div>
                    <label for="maths">Maths:</label>
                    <input type="number" id="maths" name="maths" required>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="science">Science:</label>
                    <input type="number" id="science" name="science" required>
                </div>
                <div>
                    <label for="english">English:</label>
                    <input type="number" id="english" name="english" required>
                </div>
            </div>
            <div class="form-row">
                <button type="submit">Add Student</button>
                <button type="button" id="closeFormButton">Cancel</button>
            </div>
        </form>
    </div>
    <script src="studentManagement.js"></script>
</body>
</html>
