<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e0e0e0;
        }
        main{
            width: 320px; 
            background-color: #1e1e2e;
            border-radius: 16px;
            height: fit-content;
            margin: 40px auto;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 60px);
            gap: 8px;
            background-color: transparent;
            padding: 5px;
        }
        .container div {
            background-color: #6b7b92;
            border-radius: 8px;
            font-size: 22px;
            text-align: center;
            color: white;
            line-height: 60px;    
            cursor: pointer;
            user-select: none;
            transition: background 0.1s, transform 0.1s;
        }
        .container div:hover  { background-color: #8799b3; }        
        .container div:active { background-color: #8ea5c5; }
        #input{
            width: 100%;
            background-color: #112;
            color: white;
            text-align: right;
            padding: 16px;
            font-family: monospace;
            font-size: 30px;
            margin-bottom: 12px;
            min-height: 65px;
            box-sizing: border-box;
            word-break: break-all;
            border-radius: 12px; 

        }
        .op{
            background-color: #4c326b !important;
        }
        .op:hover  { background-color: #6d469c !important; }
        .ac{
            background-color: #41055d !important;
        }
        .ac:hover{
            background-color: #67198b !important;
        }
        .eq{
            background-color: #ed5cdc !important;
        }
        .eq:hover{
            background-color: #d974cd !important;
        }
        
    </style>
</head>
<body>
    <main>
        <div id="input">
            |
        </div>
        <div class="container">
            <div onclick="ac()" class="ac">AC</div>
            <div onclick="parenthesis()" class="op">( )</div>
            <div onclick="operator('%')" class="op">%</div>
            <div onclick="operator('/')" class="op">÷</div>
            <div onclick="numButton(7)">7</div>
            <div onclick="numButton(8)">8</div>
            <div onclick="numButton(9)">9</div>
            <div onclick="operator('*')" class="op">x</div>
            <div onclick="numButton(4)">4</div>
            <div onclick="numButton(5)">5</div>
            <div onclick="numButton(6)">6</div>
            <div onclick="operator('-')" class="op">-</div>
            <div onclick="numButton(1)" >1</div>
            <div onclick="numButton(2)">2</div>
            <div onclick="numButton(3)">3</div>
            <div onclick="operator('+')" class="op">+</div>
            <div onclick="numButton(0)">0</div>
            <div onclick="addDot()">.</div>
            <div onclick="backSpace()">⌫</div>
            <div onclick="calculate()" class="eq">=</div>
        </div>
    </main>
    <script>
        let display = document.getElementById('input');
        let exp = ''; // Expression string to hold the current input
        
        function updateDisplay(value){
            display.textContent = value || '|'; // Show '|' when the display is empty and update the display with the current expression
        }

        // Clear the expression and update the display
        function ac(){
            exp = ''; 
            updateDisplay(exp);
        }

        // Append the number to the expression and update the display
        function numButton(num){ 
            exp += num;
            updateDisplay(exp);
        }

        // Append the operator to the expression and update the display
        function operator(op){ 

            if (!exp && op !== '-') return;  //Return if the expression is empty and the operator is not a minus sign

            const lastChar = exp.slice(-1);
            if (['+', '-', '*', '%', '/'].includes(lastChar)){
                exp = exp.slice(0,-1);
            }
            exp += op;
            updateDisplay(exp);
        }

        // Append decimal point to the expression and update the display
        function addDot(){
            if(exp === '') { // If the expression is empty, start with '0.'
                exp += '0.';
                updateDisplay(exp);
                return;
            }
            const parts = exp.split(/[\+\-\*\/]/);
            const lastPart = parts[parts.length - 1];
            if(lastPart.includes('.')) return;
            exp += '.'
            updateDisplay(exp);
        }

        // Toggle parentheses in the expression and update the display
        function parenthesis(){
            const openCount  = (exp.match(/\(/g) || []).length;
            const closeCount = (exp.match(/\)/g) || []).length;
            if(openCount == closeCount){
                exp += '(';
            }
            else{
                exp += ')';
            }
            updateDisplay(exp);
        }

        // Remove the last character from the expression and update the display
        function backSpace(){
            exp = exp.slice(0,-1);
            updateDisplay(exp)
        }

        function resolveParentheses(expression) {
            while (expression.includes('(')) {
                
                // Find the LAST opening bracket to get the innermost group first
                const openIndex = expression.lastIndexOf('(')
                
                // Find the matching closing bracket
                const closeIndex = expression.indexOf(')', openIndex)
                
                // If no closing bracket found — invalid expression
                if (closeIndex === -1) throw new Error("Mismatched parentheses")
                
                // Extract the inner expression (without brackets)
                const innerExp = expression.slice(openIndex + 1, closeIndex)
                
                // Evaluate the inner expression
                const innerTokens = tokenize(innerExp)
                const innerResult = evaluate(innerTokens)
                
                // Replace (innerExp) with the result in the original expression
                expression = expression.slice(0, openIndex) + innerResult + expression.slice(closeIndex + 1)
            }
            
            return expression
        }

        // Tokenize the expression into numbers and operators
       function tokenize(exp) {
            const tokens = []
            let num = ''
            
            for (let i = 0; i < exp.length; i++) {
                const char = exp[i]
                
                if ('0123456789.'.includes(char)) {
                    num += char
                    
                } else if ('+-*/%()'.includes(char)) {
                    
                    const isNegativeSign = char === '-' && num === '' &&  (tokens.length === 0 || tokens[tokens.length - 1].type === 'operator')
                    
                    if (isNegativeSign) {
                        num += '-'  // attach to the number being built
                    } else {
                        if (num) {
                            tokens.push({ type: 'number', value: parseFloat(num) })
                            num = ''
                        }
                        tokens.push({ type: 'operator', value: char })
                    }
                }
            }
            if (num) tokens.push({ type: 'number', value: parseFloat(num) })
            return tokens
        }
        
        function evaluate(tokens) {

            // First pass — handle * / % (higher precedence)
            let i = 1
            while (i < tokens.length) {
                const op = tokens[i]
                if (op.type === 'operator' && ['*', '/', '%'].includes(op.value)) {
                    const left  = tokens[i - 1].value
                    const right = tokens[i + 1].value
                    let result
                    if (op.value === '*') result = left * right
                    if (op.value === '/') result = left / right
                    if (op.value === '%') result = left % right
                    // Replace 3 tokens with result
                    tokens.splice(i - 1, 3, { type: 'number', value: result })
                } else {
                    i += 2
                }
            }

            // Second pass — handle + - (lower precedence)
            let result = tokens[0].value 
            i = 1
            while (i < tokens.length) {
                const op    = tokens[i].value
                const right = tokens[i + 1].value
                if (op === '+') result += right
                if (op === '-') result -= right
                i += 2
            }

            return result
        }

        // Evaluate the expression and update the display
        function calculate(){
            try {
                if (!exp) return
                const resolved = resolveParentheses(exp) // Resolve parentheses first as they have the highest precedence
                const tokens = tokenize(resolved)
                let result = evaluate(tokens)
                if (!isFinite(result)) {
                    updateDisplay("Error")
                    exp = ''
                    return
                }
                result = parseFloat(result.toFixed(10)) // Round to avoid floating point issues
                exp = String(result)
                updateDisplay(exp)
            } catch(e) {
                updateDisplay("Error")
                exp = ''
            }
        }

    </script>
</body>
</html>
